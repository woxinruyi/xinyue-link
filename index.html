<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盘搜搜 · 资源入口</title>
<meta name="description" content="盘搜搜资源入口:聚合网盘资源搜索、榜单、更新与社群">
<style>
/* ==========================================================
   暗色极光 · 霓虹渐变(参考 voup76.github.io/link 视觉语言)
   ========================================================== */
:root{
  --bg:#07080f; --bg-soft:#0a0c18;
  --card:rgba(10,12,24,.60); --card-hover:rgba(18,22,44,.72);
  --line:rgba(255,255,255,.08);
  --txt:#eef0ff; --sub:#8b90b5;
  --cyan:#22d3ee; --violet:#a78bfa; --pink:#f472b6;
  --grad-logo:linear-gradient(92deg,#5eead4,#22d3ee 30%,#a78bfa 65%,#f472b6);
  --grad-bar:linear-gradient(180deg,var(--cyan),var(--violet),var(--pink));
  --grad-btn:linear-gradient(135deg,#0891b2,#7c3aed);
  --shadow-card:0 10px 32px rgba(20,10,60,.5),0 0 0 1px rgba(34,211,238,.12);
  --grain-dot:rgba(255,255,255,.028);
  --veil-1:rgba(7,8,15,.28); --veil-2:rgba(7,8,15,.42); --veil-3:rgba(7,8,15,.60);
  --aura-1:rgba(120,80,255,.18); --aura-2:rgba(34,211,238,.10);
}
:root[data-theme="light"]{
  --bg:#eef1fa; --bg-soft:#ffffff;
  --card:#ffffff; --card-hover:#ffffff;
  --line:rgba(90,80,160,.10);
  --txt:#171327; --sub:#6a5f8c;
  --cyan:#7c3aed; --violet:#7c3aed; --pink:#db2777;
  --grad-logo:linear-gradient(92deg,#7c3aed,#a855f7 46%,#db2777);
  --grad-bar:linear-gradient(180deg,#7c3aed,#a855f7,#db2777);
  --shadow-card:0 14px 34px rgba(45,16,110,.22),0 2px 6px rgba(45,16,110,.10);
  --grain-dot:rgba(40,30,90,.035);
  --veil-1:rgba(244,242,251,.18); --veil-2:rgba(244,242,251,.30); --veil-3:rgba(244,242,251,.50);
  --aura-1:rgba(140,110,255,.16); --aura-2:rgba(34,211,238,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  transition:background-color .35s ease,color .35s ease;
}

/* ===== 极光背景 ===== */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,var(--aura-1),transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 110%,var(--aura-2),transparent 60%),
    var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 16s ease-in-out infinite}
.b1{width:420px;height:420px;background:#5b3df5;top:-140px;left:-100px}
.b2{width:360px;height:360px;background:#0ea5e9;top:30%;right:-140px;animation-delay:-5s;animation-duration:20s}
.b3{width:300px;height:300px;background:#d946ef;bottom:-120px;left:30%;animation-delay:-9s;animation-duration:24s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.94)}}
:root[data-theme="light"] .b1{background:#a78bfa;opacity:.35}
:root[data-theme="light"] .b2{background:#67e8f9;opacity:.35}
:root[data-theme="light"] .b3{background:#f0abfc;opacity:.35}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,var(--veil-1),var(--veil-2) 55%,var(--veil-3))}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9;
  background-image:radial-gradient(var(--grain-dot) 1px,transparent 1px);background-size:26px 26px}
:root[data-theme="dark"] .aurora::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 72% 40% at 50% -8%,rgba(255,255,255,.075),transparent 62%)}
:root[data-theme="dark"] .aurora::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(180deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/32px 32px;
  -webkit-mask-image:radial-gradient(ellipse 82% 62% at 50% 32%,#000 18%,transparent 78%);
  mask-image:radial-gradient(ellipse 82% 62% at 50% 32%,#000 18%,transparent 78%)}

.wrap{max-width:820px;margin:0 auto;padding:0 18px 80px;position:relative;z-index:1}

/* ===== 顶部 ===== */
header{padding:52px 0 10px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#9be9f7;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);
  padding:5px 14px;border-radius:99px;margin-bottom:16px;letter-spacing:1px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge i{width:7px;height:7px;border-radius:50%;background:#34d399;
  box-shadow:0 0 8px #34d399;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
:root[data-theme="light"] .badge{color:#6d4de0;background:rgba(124,58,237,.09);border-color:rgba(124,58,237,.24)}
:root[data-theme="light"] .badge i{background:#a855f7;box-shadow:0 0 8px #a855f7}
h1{font-size:34px;font-weight:800;letter-spacing:2px;
  background:var(--grad-logo);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(140,110,255,.35));
  display:flex;align-items:center;justify-content:center;gap:10px}
.hico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-size:21px;font-weight:800;color:#fff;letter-spacing:0;
  background:var(--grad-btn);
  box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 2px rgba(140,120,255,.35);
  transition:transform .3s}
h1:hover .hico{transform:rotate(-8deg) scale(1.08)}
:root[data-theme="light"] h1{filter:drop-shadow(0 4px 18px rgba(124,58,237,.18))}
:root[data-theme="light"] .hico{background:linear-gradient(135deg,#7c3aed,#db2777);
  box-shadow:0 6px 18px rgba(124,58,237,.35),0 0 0 3px rgba(255,255,255,.55)}
.sub{color:#aab0d6;font-size:14px;margin-top:10px;text-shadow:0 1px 8px rgba(0,0,0,.6);line-height:1.9}
:root[data-theme="light"] .sub{color:#4d4270;text-shadow:none}
.meta{display:flex;justify-content:center;align-items:center;gap:10px;margin:16px 0 28px}
.chip{font-size:12px;color:#a9aed4;background:rgba(10,12,24,.5);border:1px solid var(--line);
  padding:4px 13px;border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
:root[data-theme="light"] .chip{background:rgba(255,255,255,.82);color:#5b4b85;border-color:rgba(255,255,255,.60)}

/* ===== 卡片列表 ===== */
#list{display:grid;grid-template-columns:1fr;gap:14px;max-width:560px;margin:0 auto}
.item{
  position:relative;display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;text-decoration:none;color:var(--txt);overflow:hidden;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .22s cubic-bezier(.2,.8,.3,1.2),border-color .2s,background .2s,box-shadow .25s;
  animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--grad-bar);opacity:0;transition:opacity .2s}
.item:hover,.item:focus-visible{
  transform:translateY(-3px);border-color:rgba(34,211,238,.45);background:var(--card-hover);
  box-shadow:var(--shadow-card);outline:none}
.item:hover::before,.item:focus-visible::before{opacity:1}
:root[data-theme="light"] .item{border-radius:24px;border-color:transparent;
  box-shadow:0 8px 22px rgba(45,16,110,.16),0 1px 3px rgba(45,16,110,.10)}
:root[data-theme="light"] .item:hover,:root[data-theme="light"] .item:focus-visible{
  border-color:transparent;box-shadow:0 18px 40px rgba(45,16,110,.28),0 3px 8px rgba(45,16,110,.14)}
:root[data-theme="dark"] .item{
  background:linear-gradient(180deg,rgba(255,255,255,.070),rgba(255,255,255,.026));
  border-color:rgba(255,255,255,.11);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.42)}
:root[data-theme="dark"] .item:hover,:root[data-theme="dark"] .item:focus-visible{
  border-color:rgba(34,211,238,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.105),rgba(255,255,255,.048));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 44px rgba(0,0,0,.52),0 0 26px rgba(34,211,238,.10)}

/* ===== 分组标题 ===== */
.sec{display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15px;font-weight:700;letter-spacing:1.5px;color:#fff;
  margin:12px 0 2px;text-shadow:0 2px 12px rgba(40,10,90,.35);grid-column:1}
.sec svg{width:15px;height:15px;opacity:.9;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
:root[data-theme="dark"] .sec{color:#c9cef0;text-shadow:none}
:root[data-theme="light"] .sec{color:#5b4b85;text-shadow:none}

/* ===== 第一个卡片:轻微摇动 ===== */
.shakewrap{display:block;animation:shakeBox 3s linear infinite}
@keyframes shakeBox{
  0%{transform:translateX(3px) rotate(1deg)}2.5%{transform:translateX(-3px) rotate(-1deg)}
  5%{transform:translateX(3px) rotate(1deg)}7.5%{transform:translateX(-3px) rotate(-1deg)}
  10%{transform:translateX(2px) rotate(1deg)}12.5%{transform:translateX(-2px) rotate(-1deg)}
  15%{transform:translateX(2px) rotate(1deg)}17.5%{transform:translateX(-2px) rotate(-1deg)}
  20%{transform:translateX(1px) rotate(1deg)}22.5%{transform:translateX(-1px) rotate(-1deg)}
  25%{transform:translateX(0) rotate(0)}}

.ava{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  color:#fff;font-size:23px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .25s}
.item:hover .ava{transform:scale(1.06) rotate(-4deg)}
.g0{background:linear-gradient(135deg,#0891b2,#7c3aed)}
.g1{background:linear-gradient(135deg,#db2777,#7c3aed)}
.g2{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.g3{background:linear-gradient(135deg,#d97706,#db2777)}
.g4{background:linear-gradient(135deg,#f43f5e,#f59e0b)}
.g5{background:linear-gradient(135deg,#059669,#0891b2)}
:root[data-theme="light"] .g0{background:linear-gradient(135deg,#7c3aed,#c026d3)}
:root[data-theme="light"] .g1{background:linear-gradient(135deg,#db2777,#a855f7)}
:root[data-theme="light"] .g2{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
:root[data-theme="light"] .g3{background:linear-gradient(135deg,#c026d3,#f472b6)}
:root[data-theme="light"] .g4{background:linear-gradient(135deg,#e11d48,#f59e0b)}
:root[data-theme="light"] .g5{background:linear-gradient(135deg,#0d9488,#7c3aed)}

.info{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill{flex:none;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600}
.pill.v{color:#7de8f8;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.3)}
.pill.n{color:#c4b1fa;background:rgba(167,139,250,.10);border:1px solid rgba(167,139,250,.3)}
.pill.r{color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777);border:1px solid transparent;
  box-shadow:0 2px 10px rgba(124,58,237,.45);letter-spacing:.5px}
:root[data-theme="light"] .pill.r{box-shadow:0 3px 12px rgba(124,58,237,.38)}
:root[data-theme="light"] .pill.v{color:#a21caf;background:rgba(219,39,119,.09);border-color:rgba(219,39,119,.26)}
:root[data-theme="light"] .pill.n{color:#6d4de0;background:rgba(124,58,237,.09);border-color:rgba(124,58,237,.26)}
.note{color:var(--sub);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.go-btn{flex:none;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:700;
  letter-spacing:.5px;color:#7de8f8;background:rgba(34,211,238,.06);
  border:1px solid rgba(34,211,238,.45);
  text-shadow:0 0 8px rgba(34,211,238,.5);
  box-shadow:0 0 10px rgba(34,211,238,.15),inset 0 0 8px rgba(34,211,238,.08);
  transition:all .2s ease;white-space:nowrap}
.item:hover .go-btn,.item:focus-visible .go-btn{
  color:#04121a;background:linear-gradient(90deg,#22d3ee,#67e8f9);
  border-color:transparent;text-shadow:none;
  box-shadow:0 0 18px rgba(34,211,238,.55);transform:translateX(2px)}
:root[data-theme="light"] .go-btn{color:#6d4de0;background:rgba(124,58,237,.07);
  border-color:rgba(124,58,237,.38);text-shadow:none;box-shadow:none}
:root[data-theme="light"] .item:hover .go-btn,
:root[data-theme="light"] .item:focus-visible .go-btn{
  color:#fff;background:linear-gradient(90deg,#7c3aed,#a855f7);
  border-color:transparent;box-shadow:0 6px 18px rgba(124,58,237,.42)}

/* ===== 页脚 ===== */
footer{text-align:center;color:#565b80;font-size:12px;margin-top:56px;line-height:1.9}
footer .heart{color:var(--pink)}
:root[data-theme="light"] footer{color:#7a6f9e}

/* ===== 主题切换 ===== */
.theme-toggle{position:fixed;top:20px;right:20px;z-index:20;width:38px;height:38px;
  border-radius:12px;display:grid;place-items:center;cursor:pointer;
  color:#a9aed4;background:rgba(10,12,24,.55);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .22s}
.theme-toggle:hover{color:#7de8f8;border-color:rgba(34,211,238,.45);transform:translateY(-1px)}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle svg{width:16px;height:16px;position:absolute;transition:opacity .3s,transform .4s}
[data-theme="dark"] .icon-moon{opacity:0;transform:rotate(-35deg) scale(.7)}
[data-theme="light"] .icon-sun{opacity:0;transform:rotate(35deg) scale(.7)}
:root[data-theme="light"] .theme-toggle{background:rgba(255,255,255,.75);color:#5f648a}

/* ===== 赞助弹窗 ===== */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px}
.modal.show{display:grid}
.modal-mask{position:absolute;inset:0;background:rgba(4,6,16,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-card{position:relative;z-index:1;width:min(430px,94vw);border-radius:20px;padding:24px 20px 18px;text-align:center;
  background:linear-gradient(180deg,rgba(22,26,48,.98),rgba(12,15,30,.98));border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 70px rgba(0,0,0,.62);animation:pop .25s ease}
:root[data-theme="light"] .modal-card{background:#fff;border-color:rgba(124,58,237,.16);
  box-shadow:0 30px 70px rgba(60,20,120,.30)}
.modal-card h3{margin:0 0 6px;font-size:17px;letter-spacing:.5px}
:root[data-theme="light"] .modal-card h3{color:#2c1a5e}
.modal-card p{margin:0;color:var(--sub);font-size:12.5px}
.modal-close{position:absolute;top:8px;right:12px;background:none;border:0;font-size:22px;line-height:1;
  color:#8b90b5;cursor:pointer;padding:4px}
.modal-close:hover{color:#fff}
:root[data-theme="light"] .modal-close:hover{color:#4b2a8f}
.qr-row{display:flex;gap:14px;justify-content:center;margin:16px 0 10px;flex-wrap:wrap}
.qr-row figure{margin:0}
.qr-row img{width:150px;height:150px;border-radius:12px;background:#fff;padding:6px;display:block}
.qr-row figcaption{margin-top:8px;font-size:12px;color:var(--sub)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.item.sponsor-item{width:100%;text-align:left;cursor:pointer;font:inherit}
.tiny{font-size:11.5px;color:#6f7398;margin-top:2px}

/* ===== 开屏加载层 ===== */
.boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:radial-gradient(62% 52% at 50% 42%,#141a33 0%,#07080f 72%);
  transition:opacity .45s ease,visibility .45s ease}
.boot.out{opacity:0;visibility:hidden;pointer-events:none}
:root[data-theme="light"] .boot{background:radial-gradient(62% 52% at 50% 42%,#f6f1ff 0%,#e9e2fb 72%)}
.boot-box{display:grid;place-items:center;gap:14px}
.boot-name{font-size:15px;font-weight:700;letter-spacing:3px;color:#e9ecff}
.boot-sub{font-size:12px;letter-spacing:2px;color:#7d84ad}
:root[data-theme="light"] .boot-name{color:#3c2a72}
:root[data-theme="light"] .boot-sub{color:#6b5c9a}
.boot-ring{position:relative;width:78px;height:78px}
.boot-ring svg{width:78px;height:78px;transform:rotate(-90deg)}
.boot-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.boot-ring .trk{stroke:rgba(255,255,255,.10)}
:root[data-theme="light"] .boot-ring .trk{stroke:rgba(80,40,160,.12)}
.boot-ring .bar{stroke:url(#bg1);transition:stroke-dashoffset .12s linear}
.boot-pct{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;color:#e9ecff}
:root[data-theme="light"] .boot-pct{color:#3c2a72}

@media (max-width:640px){
  header{padding-top:44px}
  h1{font-size:27px;letter-spacing:1px}
  .hico{width:40px;height:40px;border-radius:11px;font-size:18px}
  .sub{font-size:13px}
  .theme-toggle{top:14px;right:14px;width:34px;height:34px;border-radius:10px}
  .wrap{padding-bottom:64px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<!-- 开屏加载 -->
<div class="boot" id="boot">
  <div class="boot-box">
    <div class="boot-ring">
      <svg viewBox="0 0 72 72"><defs>
        <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22d3ee"/><stop offset="60%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/>
        </linearGradient></defs>
        <circle class="trk" cx="36" cy="36" r="33"/>
        <circle class="bar" cx="36" cy="36" r="33" stroke="url(#bg1)" stroke-dasharray="207.3" stroke-dashoffset="207.3"/>
      </svg>
      <div class="boot-pct" id="bootPct">0%</div>
    </div>
    <div class="boot-name" id="bootName">盘搜搜资源入口</div>
    <div class="boot-sub">LOADING RESOURCES</div>
  </div>
</div>

<!-- 背景层 -->
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="veil"></div>
<div class="grain"></div>

<!-- 主题切换 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换主题">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<div class="wrap">
  <header>
    <div class="badge"><i></i><span id="badge">资源站运行中</span></div>
    <h1><span class="hico" id="logoTxt">PS</span><span id="siteName">盘搜搜资源入口</span></h1>
    <div class="sub" id="siteSub">聚合网盘资源搜索 · 每日更新 · 完全免费</div>
    <div class="meta"><span class="chip">资源均免费分享 · 无任何套路</span></div>
  </header>

  <nav id="list"></nav>

  <footer id="foot"></footer>
</div>

<!-- 赞助弹窗 -->
<div class="modal" id="sponsorModal" aria-hidden="true">
  <div class="modal-mask" data-close></div>
  <div class="modal-card">
    <button class="modal-close" data-close aria-label="关闭">×</button>
    <h3>感谢你的支持 ♥</h3>
    <p>扫码赞助,金额随意 · 全部用于资源与服务器维护<br>手机长按图片保存,或用另一台设备扫码</p>
    <div class="qr-row" id="qrs"></div>
    <p class="tiny">点击遮罩或按 ESC 关闭</p>
  </div>
</div>

<script>
/* ===== 主题 ===== */
(function(){
  var root=document.documentElement;
  try{root.dataset.theme=localStorage.getItem('xy-theme-2')||'dark';}catch(e){root.dataset.theme='dark';}
  document.getElementById('themeToggle').addEventListener('click',function(){
    var t=root.dataset.theme==='dark'?'light':'dark';
    root.dataset.theme=t;
    try{localStorage.setItem('xy-theme-2',t);}catch(e){}
  });
})();

/* ===== 后台动态配置 =====
   数据源: https://xinyue.aiyiwei.cn/api/other/portal
   后台 qfadmin → 基础配置 → 落地页配置 tab 可改:
   入口页链接列表(每行 图标|标题|副标题|链接|标签1,标签2,#开头=分组)
   /QQ群链接/微信赞助码/支付宝赞助码
   接口失败或字段为空 → 用 DEFAULT 兜底 */
var API='https://xinyue.aiyiwei.cn/api/other/portal';
var DEFAULT={
  site_name:'盘搜搜',site_sub:'聚合网盘资源搜索 · 每日更新 · 完全免费',
  footer:'本站仅做资源索引,完全免费,请勿相信广告,谨防上当受骗',
  qq_link:'',
  links:[
    {type:'group',title:'资源合集'},
    {type:'link',icon:'🔍',title:'盘搜搜主站',sub:'聚合多个网盘来源 · 快速搜索资源',url:'https://xinyue.aiyiwei.cn',tags:['推荐','每日更新']},
    {type:'link',icon:'🔥',title:'夸克热搜榜单',sub:'热门影视资源 · 实时排行',url:'https://xinyue.aiyiwei.cn/ranking',tags:['精选']},
    {type:'link',icon:'🏆',title:'豆瓣 Top250',sub:'经典高分电影合集',url:'https://xinyue.aiyiwei.cn/top250',tags:[]},
    {type:'link',icon:'🎮',title:'游戏资源排行',sub:'精选游戏资源推荐',url:'https://xinyue.aiyiwei.cn/game',tags:[]},
    {type:'link',icon:'🆕',title:'最近更新',sub:'最新入库资源一览',url:'https://xinyue.aiyiwei.cn/latest',tags:[]}
  ],
  donate:{wechat:'',alipay:''}
};

var esc=function(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var PILL_CLS=['r','v','n']; // 标签循环配色:紫粉/品红/紫

function render(d){
  document.getElementById('siteName').textContent=(d.site_name||'盘搜搜')+'资源入口';
  document.getElementById('siteSub').textContent=d.site_sub||DEFAULT.site_sub;
  document.getElementById('logoTxt').textContent=(d.site_name||'PS').slice(0,2);

  var list=document.getElementById('list');
  list.innerHTML='';
  var items=(d.links&&d.links.length?d.links:DEFAULT.links).slice();
  if(d.qq_link){items.push({type:'link',icon:'💬',title:'QQ 交流群',sub:'资源更新 · 交流互助',url:d.qq_link,tags:['交流']});}
  var dn=(d.donate&&(d.donate.wechat||d.donate.alipay))?d.donate:null;
  if(dn){items.push({type:'sponsor',icon:'💖',title:'感谢支持 · 赞助站长',sub:'金额随意 · 用于资源与服务器维护',tags:['♥']});}

  var firstLink=true;
  items.forEach(function(l,i){
    if(l.type==='group'){
      var h=document.createElement('div');h.className='sec';
      h.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.9H21l-5.4 4 2 7.1L12 16l-5.6 4 2-7.1-5.4-4h6.6z"/></svg>'+esc(l.title);
      list.appendChild(h);return;
    }
    var card=document.createElement(l.type==='sponsor'?'button':'a');
    card.className='item'+(l.type==='sponsor'?' sponsor-item':'');
    if(l.type==='sponsor'){card.id='sponsorOpen';card.type='button';}
    else{card.href=esc(l.url);card.target='_blank';card.rel='noopener';}
    var pills='';
    (l.tags||[]).forEach(function(t,k){pills+='<span class="pill '+PILL_CLS[k%3]+'">'+esc(t)+'</span>';});
    card.innerHTML='<div class="ava g'+(i%6)+'">'+esc(l.icon||'🔗')+'</div>'+
      '<div class="info"><div class="trow"><span class="title">'+esc(l.title)+'</span>'+pills+'</div>'+
      '<div class="note">'+esc(l.sub)+'</div></div>'+
      '<div class="go-btn">'+(l.type==='sponsor'?'赞助':'前往')+'</div>';
    card.style.animationDelay=(0.08+i*0.06)+'s';
    if(l.type==='link'&&firstLink){
      var wrap=document.createElement('span');wrap.className='shakewrap';wrap.style.display='block';
      firstLink=false;wrap.appendChild(card);list.appendChild(wrap);
    }else{list.appendChild(card);}
  });

  if(dn){
    var qrs=document.getElementById('qrs');qrs.innerHTML='';
    [['wechat','微信'],['alipay','支付宝']].forEach(function(pair){
      if(!dn[pair[0]])return;
      var f=document.createElement('figure');
      f.innerHTML='<img data-src="'+esc(dn[pair[0]])+'" alt="'+pair[1]+'赞助码"><figcaption>'+pair[1]+'</figcaption>';
      qrs.appendChild(f);
    });
    bindSponsor();
  }

  document.getElementById('foot').innerHTML=
    '<p>'+esc(d.footer||DEFAULT.footer)+'</p>'+
    '<p><span class="heart">♥</span> 主站:<a style="color:inherit" href="https://xinyue.aiyiwei.cn" target="_blank" rel="noopener">xinyue.aiyiwei.cn</a></p>';
}

/* 赞助弹窗 */
function bindSponsor(){
  var modal=document.getElementById('sponsorModal');
  var open=document.getElementById('sponsorOpen');
  if(!modal||!open)return;
  function loadImgs(){
    modal.querySelectorAll('img[data-src]').forEach(function(im){
      if(!im.getAttribute('src'))im.setAttribute('src',im.getAttribute('data-src'));
    });
  }
  function show(on){
    if(on)loadImgs();
    modal.classList.toggle('show',on);
    modal.setAttribute('aria-hidden',on?'false':'true');
    document.body.style.overflow=on?'hidden':'';
  }
  open.addEventListener('click',function(){show(true)});
  modal.addEventListener('click',function(e){if(e.target.hasAttribute('data-close'))show(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')show(false)});
}

/* 拉取后台配置,失败回退默认 */
var _done=false;
function applyOnce(d){if(_done)return;_done=true;render(d);}
render(DEFAULT); // 先渲染兜底
fetch(API).then(function(r){return r.json()}).then(function(j){
  applyOnce(j&&j.data?Object.assign({},DEFAULT,j.data):DEFAULT);
}).catch(function(){applyOnce(DEFAULT)});
setTimeout(function(){applyOnce(DEFAULT)},6000);

/* ===== 开屏加载环 ===== */
(function(){
  var MIN=700,t0=Date.now(),b=document.getElementById('boot');
  document.documentElement.style.overflow='hidden';
  var bar=b.querySelector('.bar'),pct=document.getElementById('bootPct');
  var LEN=207.3,DUR=Math.min(MIN,900);
  function tick(){
    var p=Math.min(1,(Date.now()-t0)/DUR);
    bar.style.strokeDashoffset=(LEN*(1-p)).toFixed(1);
    pct.textContent=Math.round(p*100)+'%';
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  function hide(){
    var wait=Math.max(0,MIN-(Date.now()-t0));
    setTimeout(function(){
      bar.style.strokeDashoffset=0;pct.textContent='100%';
      document.documentElement.style.overflow='';
      b.classList.add('out');
      setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b)},600);
    },wait);
  }
  if(document.readyState==='complete')hide();
  else window.addEventListener('load',hide);
  setTimeout(hide,5000);
})();
</script>
</body>
</html>
