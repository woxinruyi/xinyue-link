<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盘搜搜 · 资源入口</title>
<meta name="description" content="盘搜搜资源入口：聚合网盘资源搜索、榜单、更新与社群">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg1:#f6f7fb; --bg2:#eef1f8;
    --card:#ffffff; --card-hover:#ffffff;
    --border:rgba(120,130,160,.14);
    --text:#1d2433; --sub:#8a93a6;
    --brand:#ff6a3d; --brand2:#ff8f4d;
    --shadow:0 6px 24px rgba(31,45,61,.08);
    --shadow-hover:0 12px 32px rgba(255,106,61,.18);
  }
  body.dark {
    --bg1:#12151d; --bg2:#0e1118;
    --card:#1b2030; --card-hover:#222842;
    --border:rgba(255,255,255,.08);
    --text:#e8ecf4; --sub:#8b94ab;
    --shadow:0 6px 24px rgba(0,0,0,.35);
    --shadow-hover:0 12px 32px rgba(255,106,61,.25);
  }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:56px 20px 40px;
    transition:background .3s,color .3s;
  }
  .wrap { width:100%; max-width:460px; }
  /* ===== 头部 ===== */
  .head { text-align:center; margin-bottom:28px; }
  .logo {
    width:72px;height:72px;margin:0 auto 14px;border-radius:20px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;color:#fff;
    box-shadow:0 10px 26px rgba(255,106,61,.4);
  }
  .head h1 { font-size:22px;letter-spacing:1px; }
  .head p { color:var(--sub);font-size:13px;margin-top:6px; }
  /* ===== 卡片列表 ===== */
  .links { display:flex;flex-direction:column;gap:14px; }
  .card {
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:16px 18px;
    box-shadow:var(--shadow);text-decoration:none;color:var(--text);
    transition:transform .18s,box-shadow .18s,border-color .18s;
  }
  .card:hover { transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:rgba(255,106,61,.45); }
  .icon {
    width:44px;height:44px;flex:none;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:21px;
    background:linear-gradient(135deg,rgba(255,106,61,.14),rgba(255,143,77,.14));
  }
  .txt { flex:1;min-width:0; }
  .txt b { display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .txt span { display:block;font-size:12px;color:var(--sub);margin-top:3px; }
  .go {
    flex:none;font-size:12px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    padding:7px 16px;border-radius:999px;
  }
  /* ===== 赞助区 ===== */
  .donate {
    margin-top:30px;background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:22px 18px;text-align:center;box-shadow:var(--shadow);
  }
  .donate h2 { font-size:15px;margin-bottom:6px; }
  .donate h2 em { color:var(--brand);font-style:normal; }
  .donate p { font-size:12px;color:var(--sub);line-height:1.8; }
  .qrs { display:flex;gap:14px;justify-content:center;margin-top:14px; }
  .qrs img { width:140px;height:140px;border-radius:12px;border:1px solid var(--border);object-fit:cover;background:#fff; }
  .qrs .cap { font-size:11px;color:var(--sub);margin-top:6px; }
  /* ===== 页脚 ===== */
  .foot { margin-top:26px;text-align:center;font-size:12px;color:var(--sub);line-height:1.9; }
  .foot a { color:var(--sub); }
  /* ===== 主题切换 ===== */
  .theme {
    position:fixed;top:18px;right:18px;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);
    cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:380px){ .qrs img{width:118px;height:118px;} }
</style>
</head>
<body>
<button class="theme" id="themeBtn" title="切换主题">🌙</button>
<div class="wrap">
  <header class="head">
    <div class="logo" id="logo">PS</div>
    <h1 id="siteName">盘搜搜资源入口</h1>
    <p id="siteSub">聚合网盘资源搜索 · 每日更新 · 完全免费</p>
  </header>

  <nav class="links" id="links"></nav>

  <section class="donate" id="donateSec" style="display:none">
    <h2>感谢你的支持 <em>♥</em></h2>
    <p>扫码赞助,金额随意 · 全部用于资源与服务器维护<br>手机长按图片保存,或用另一台设备扫码</p>
    <div class="qrs" id="qrs"></div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>
<script>
/* ===== 主题切换 ===== */
const b=document.body,k='xy-theme';
if(localStorage.getItem(k)==='dark'){b.classList.add('dark');}
document.getElementById('themeBtn').onclick=()=>{
  b.classList.toggle('dark');
  localStorage.setItem(k,b.classList.contains('dark')?'dark':'light');
};

/* ===== 后台动态配置 =====
   数据源: https://xinyue.aiyiwei.cn/api/other/portal
   后台 qfadmin → 基础设置 可改:入口页链接列表/QQ群链接/微信赞助码/支付宝赞助码
   接口失败或字段为空 → 用下面 DEFAULT 兜底 */
const API='https://xinyue.aiyiwei.cn/api/other/portal';
const DEFAULT={
  site_name:'盘搜搜',site_sub:'聚合网盘资源搜索 · 每日更新 · 完全免费',
  footer:'本站仅做资源索引,完全免费,请勿相信广告,谨防上当受骗',
  qq_link:'',
  links:[
    {icon:'🔍',title:'盘搜搜主站',sub:'聚合多个网盘来源 · 快速搜索资源',url:'https://xinyue.aiyiwei.cn'},
    {icon:'🔥',title:'夸克热搜榜单',sub:'热门影视资源 · 实时排行',url:'https://xinyue.aiyiwei.cn/ranking'},
    {icon:'🏆',title:'豆瓣 Top250',sub:'经典高分电影合集',url:'https://xinyue.aiyiwei.cn/top250'},
    {icon:'🎮',title:'游戏资源排行',sub:'精选游戏资源推荐',url:'https://xinyue.aiyiwei.cn/game'},
    {icon:'🆕',title:'最近更新',sub:'最新入库资源一览',url:'https://xinyue.aiyiwei.cn/latest'}
  ],
  donate:{wechat:'',alipay:''}
};

const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(d){
  document.getElementById('siteName').textContent=(d.site_name||'盘搜搜')+'资源入口';
  document.getElementById('siteSub').textContent=d.site_sub||DEFAULT.site_sub;
  document.getElementById('logo').textContent=(d.site_name||'PS').slice(0,2).toUpperCase()==='盘搜'?'PS':esc((d.site_name||'PS').slice(0,2));

  const nav=document.getElementById('links');
  nav.innerHTML='';
  const links=(d.links&&d.links.length?d.links:DEFAULT.links).slice();
  if(d.qq_link){links.push({icon:'💬',title:'QQ 交流群',sub:'资源更新 · 交流互助',url:d.qq_link});}
  links.forEach(l=>{
    const a=document.createElement('a');
    a.className='card';a.href=esc(l.url);a.target='_blank';a.rel='noopener';
    a.innerHTML='<div class="icon">'+esc(l.icon||'🔗')+'</div>'+
      '<div class="txt"><b>'+esc(l.title)+'</b><span>'+esc(l.sub)+'</span></div>'+
      '<div class="go">前往</div>';
    nav.appendChild(a);
  });

  const dn=(d.donate&&(d.donate.wechat||d.donate.alipay))?d.donate:null;
  if(dn){
    const qrs=document.getElementById('qrs');qrs.innerHTML='';
    [['wechat','微信'],['alipay','支付宝']].forEach(([key,cap])=>{
      if(!dn[key])return;
      const w=document.createElement('div');
      w.innerHTML='<img src="'+esc(dn[key])+'" alt="'+cap+'赞助码"><div class="cap">'+cap+'</div>';
      qrs.appendChild(w);
    });
    if(qrs.children.length)document.getElementById('donateSec').style.display='';
  }

  document.getElementById('foot').innerHTML=
    '<p>'+esc(d.footer||DEFAULT.footer)+'</p>'+
    '<p>主站:<a href="https://xinyue.aiyiwei.cn" target="_blank" rel="noopener">xinyue.aiyiwei.cn</a></p>';
}

fetch(API,{signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined})
  .then(r=>r.json()).then(j=>{render(j&&j.data?Object.assign({},DEFAULT,j.data):DEFAULT);})
  .catch(()=>render(DEFAULT));
render(DEFAULT); // 先渲染兜底,接口回来后覆盖
</script>
</body>
</html>
